<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Avaliação Integradora 2026/2 — ADS</title>
    <meta name="theme-color" content="#31b279" />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #000000, #202020);
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 20px;
      }

      .card {
        width: 100%;
        max-width: 560px;
        background: #fff;
        color: #222;
        border-radius: 18px;
        padding: 40px;
        text-align: center;
        box-shadow: 0 20px 70px rgba(0, 0, 0, 0.65);
      }

      .icone {
        font-size: 60px;
        margin-bottom: 15px;
      }

      h1 {
        font-size: 26px;
        margin-bottom: 10px;
      }

      .curso {
        color: #31b279;
        font-size: 17px;
        font-weight: bold;
        margin-bottom: 25px;
      }

      .instrucao {
        color: #555;
        margin-bottom: 18px;
      }

      .campi {
        display: grid;
        gap: 12px;
      }

      .campus {
        display: block;
        padding: 18px;
        background: #31b279;
        color: #fff;
        border-radius: 10px;
        font-size: 18px;
        font-weight: bold;
        text-decoration: none;
        letter-spacing: 1px;
        transition: 0.2s;
      }

      .campus:hover {
        background: #269764;
        transform: scale(1.01);
      }

      @media (max-width: 700px) {
        .card {
          padding: 25px;
        }
      }
    </style>
  </head>

  <body>
    <div class="card">
      <div class="icone">📝</div>

      <h1>Avaliação Integradora do 2º Bimestre 2026/2</h1>

      <div class="curso">
        Curso Superior de Tecnologia em Análise e Desenvolvimento de Sistemas
      </div>

      <p class="instrucao">Selecione o seu campus:</p>

      <div class="campi">
        <a class="campus" href="avaliacao_integradora_Adrianopolis.html">ADRIANÓPOLIS</a>
        <a class="campus" href="avaliacao_integradora_Centro.html">CENTRO</a>
        <a class="campus" href="avaliacao_integradora_ViaNorte.html">VIA NORTE</a>
      </div>
    </div>
  </body>
</html>
